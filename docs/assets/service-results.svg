<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Measured service behavior</title><desc id="desc">Sequential local service calls including SQLite and in-process mock API. Not HTTP, ASR, TTS or production latency.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e"/></marker></defs><rect width="1040" height="480" rx="16" fill="#f6f8fc"/><text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17263c" font-weight="700" xml:space="preserve">Measured service behavior</text><text x="32" y="72" font-family="Arial, sans-serif" font-size="15" fill="#526278" font-weight="400" xml:space="preserve">Actual local service timings · SQLite + in-process mock API · 30 runs after 3 warmups</text><rect x="24" y="94" width="992" height="280" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="48" y="132" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="700" xml:space="preserve">OPERATION</text><text x="540" y="132" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="700" xml:space="preserve">MEDIAN</text><text x="760" y="132" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="700" xml:space="preserve">P95</text><text x="48" y="182" font-family="Arial, sans-serif" font-size="18" fill="#17263c" font-weight="400" xml:space="preserve">Create after reviewed summary</text><text x="540" y="182" font-family="Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="700" xml:space="preserve">2.303 ms</text><text x="760" y="182" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="400" xml:space="preserve">2.491 ms</text><text x="48" y="234" font-family="Arial, sans-serif" font-size="18" fill="#17263c" font-weight="400" xml:space="preserve">Reschedule, same external ID</text><text x="540" y="234" font-family="Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="700" xml:space="preserve">2.105 ms</text><text x="760" y="234" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="400" xml:space="preserve">2.771 ms</text><text x="48" y="286" font-family="Arial, sans-serif" font-size="18" fill="#17263c" font-weight="400" xml:space="preserve">Cancel, verified result</text><text x="540" y="286" font-family="Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="700" xml:space="preserve">1.312 ms</text><text x="760" y="286" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="400" xml:space="preserve">1.540 ms</text><text x="48" y="338" font-family="Arial, sans-serif" font-size="18" fill="#17263c" font-weight="400" xml:space="preserve">Read appointment status</text><text x="540" y="338" font-family="Arial, sans-serif" font-size="22" fill="#0f766e" font-weight="700" xml:space="preserve">0.841 ms</text><text x="760" y="338" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="400" xml:space="preserve">0.931 ms</text><text x="32" y="414" font-family="Arial, sans-serif" font-size="15" fill="#526278" font-weight="400" xml:space="preserve">Not ASR, TTS, HTTP, end-to-end response time or a production capacity benchmark.</text><text x="32" y="445" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Python 3.14.7 · 16 logical CPUs · full hardware and raw samples in JSON</text></svg>
