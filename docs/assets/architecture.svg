<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Local speech-driven appointment workflow</title><desc id="desc">Implementation map of app.py, dialog, service, Store and local MIS; optional speech is not validated in this environment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e"/></marker></defs><rect width="1040" height="480" rx="16" fill="#f6f8fc"/><text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17263c" font-weight="700" xml:space="preserve">Local speech-driven appointment workflow</text><text x="32" y="70" font-family="Arial, sans-serif" font-size="15" fill="#526278" font-weight="400" xml:space="preserve">Implemented local components; current execution evidence covers the service + mock only.</text><rect x="32" y="108" width="224" height="92" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="48" y="143" font-family="Arial, sans-serif" font-size="19" fill="#17263c" font-weight="700" xml:space="preserve">Gradio UI</text><text x="48" y="171" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Text + microphone</text><rect x="280" y="108" width="224" height="92" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="296" y="143" font-family="Arial, sans-serif" font-size="19" fill="#17263c" font-weight="700" xml:space="preserve">Speech input</text><text x="296" y="171" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">faster-whisper / local</text><rect x="528" y="108" width="224" height="92" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="544" y="143" font-family="Arial, sans-serif" font-size="19" fill="#17263c" font-weight="700" xml:space="preserve">Dialogue controller</text><text x="544" y="171" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserv